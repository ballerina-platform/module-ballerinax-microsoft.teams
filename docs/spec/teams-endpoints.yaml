components:
  securitySchemes:
    azureaadv2:
      type: oauth2
      description: >-
        Microsoft identity platform (Entra ID) OAuth 2.0. All Microsoft Graph
        requests require an Authorization: Bearer <access-token> header.
        Delegated (on-behalf-of-user) access uses the authorization-code flow
        (with offline_access for refresh tokens); app-only access uses the
        client-credentials flow with the https://graph.microsoft.com/.default
        scope, which maps to the application permissions granted to the app
        registration (admin consent required). Replace 'common' in the URLs
        with a tenant ID or domain to restrict sign-in to a single tenant.
      flows:
        authorizationCode:
          authorizationUrl: https://login.microsoftonline.com/common/oauth2/v2.0/authorize
          tokenUrl: https://login.microsoftonline.com/common/oauth2/v2.0/token
          refreshUrl: https://login.microsoftonline.com/common/oauth2/v2.0/token
          scopes:
            offline_access: Maintain access to data you have given it access to (issues a refresh token)
            Team.ReadBasic.All: Read the names and descriptions of teams
            Team.Create: Create teams
            TeamSettings.Read.All: Read teams' settings
            TeamSettings.ReadWrite.All: Read and change teams' settings
            TeamMember.Read.All: Read the members of teams
            TeamMember.ReadWrite.All: Add and remove members from teams
            Channel.ReadBasic.All: Read the names and descriptions of channels
            Channel.Create: Create channels
            Channel.Delete.All: Delete channels
            ChannelSettings.Read.All: Read the names, descriptions, and settings of channels
            ChannelSettings.ReadWrite.All: Read and change the names, descriptions, and settings of channels
            ChannelMember.Read.All: Read the members of channels
            ChannelMember.ReadWrite.All: Add and remove members from channels
            ChannelMessage.Read.All: Read user channel messages
            ChannelMessage.Send: Send channel messages
            ChannelMessage.Edit: Edit user's channel messages
            TeamsTab.Read.All: Read tabs in Microsoft Teams
            TeamsTab.Create: Create tabs in Microsoft Teams
            TeamsTab.ReadWrite.All: Read and write tabs in Microsoft Teams
            TeamworkTag.Read: Read tags in Teams
            TeamworkTag.ReadWrite: Read and write tags in Teams
            TeamsActivity.Send: Send a teamwork activity as the user
            Files.Read.All: Read all files the user can access (channel filesFolder)
        clientCredentials:
          tokenUrl: https://login.microsoftonline.com/common/oauth2/v2.0/token
          scopes:
            https://graph.microsoft.com/.default: >-
              All application permissions granted to the app registration
              (e.g. Team.ReadBasic.All, TeamMember.ReadWrite.All,
              ChannelMessage.Read.All, Teamwork.Migrate.All). Requires admin consent.
  schemas:
    BaseItem:
      allOf:
        - $ref: '#/components/schemas/Entity'
        - title: baseItem
          required:
            - '@odata.type'
          type: object
          properties:
            createdBy:
              anyOf:
                - $ref: '#/components/schemas/IdentitySet'
                - type: object
                  nullable: true
              description: 'Identity of the user, device, or application that created the item. Read-only.'
            createdDateTime:
              pattern: '^[0-9]{4,}-(0[1-9]|1[012])-(0[1-9]|[12][0-9]|3[01])T([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]([.][0-9]{1,12})?(Z|[+-][0-9][0-9]:[0-9][0-9])$'
              type: string
              description: Date and time of item creation. Read-only.
              format: date-time
            description:
              type: string
              description: Provides a user-visible description of the item. Optional.
              nullable: true
            eTag:
              type: string
              description: ETag for the item. Read-only.
              nullable: true
            lastModifiedBy:
              anyOf:
                - $ref: '#/components/schemas/IdentitySet'
                - type: object
                  nullable: true
              description: 'Identity of the user, device, and application that last modified the item. Read-only.'
            lastModifiedDateTime:
              pattern: '^[0-9]{4,}-(0[1-9]|1[012])-(0[1-9]|[12][0-9]|3[01])T([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]([.][0-9]{1,12})?(Z|[+-][0-9][0-9]:[0-9][0-9])$'
              type: string
              description: Date and time the item was last modified. Read-only.
              format: date-time
            name:
              type: string
              description: The name of the item. Read-write.
              nullable: true
            parentReference:
              anyOf:
                - $ref: '#/components/schemas/ItemReference'
                - type: object
                  nullable: true
              description: 'Parent information, if the item has a parent. Read-write.'
            webUrl:
              type: string
